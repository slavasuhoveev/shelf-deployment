{{- if .Values.shelfApiDb.enabled }}
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ .Values.shelfApiDb.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.shelfApiDb.name }}
    app.kubernetes.io/component: database

spec:
  serviceName: {{ .Values.shelfApiDb.name }}
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.shelfApiDb.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.shelfApiDb.name }}
        app.kubernetes.io/component: database

    spec:
      containers:
        - name: {{ .Values.shelfApiDb.name }}
          image: "{{ .Values.shelfApiDb.image.repository }}:{{ .Values.shelfApiDb.image.tag }}"
          imagePullPolicy: {{ .Values.shelfApiDb.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.shelfApiDb.service.port }}

          env:
            {{- range $key, $value := .Values.shelfApiDb.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.shelfApiDb.env.POSTGRES_USER }} -d {{ .Values.shelfApiDb.env.POSTGRES_DB }}
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.shelfApiDb.env.POSTGRES_USER }} -d {{ .Values.shelfApiDb.env.POSTGRES_DB }}
            initialDelaySeconds: 15
            periodSeconds: 20

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.shelfApiDb.storage.size }}
{{- end }}