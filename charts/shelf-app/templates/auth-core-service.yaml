apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.shelfAuth.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.shelfAuth.name }}
  ports:
    - port: {{ .Values.shelfAuth.service.port }}
      targetPort: {{ .Values.shelfAuth.service.port }}
