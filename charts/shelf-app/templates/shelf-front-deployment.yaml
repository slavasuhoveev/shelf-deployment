apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.shelfFront.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.shelfFront.name }}
    app.kubernetes.io/component: frontend

spec:
  replicas: {{ .Values.shelfFront.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.shelfFront.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.shelfFront.name }}
        app.kubernetes.io/component: frontend

    spec:
      containers:
        - name: {{ .Values.shelfFront.name }}
          image: "{{ .Values.shelfFront.image.repository }}:{{ .Values.shelfFront.image.tag }}"
          imagePullPolicy: {{ .Values.shelfFront.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.shelfFront.service.port }}

          env:
            {{- range $key, $value := .Values.shelfFront.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: {{ .Values.shelfFront.probes.readiness.path }}
              port: {{ .Values.shelfFront.service.port }}
            initialDelaySeconds: {{ .Values.shelfFront.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.shelfFront.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.shelfFront.probes.liveness.path }}
              port: {{ .Values.shelfFront.service.port }}
            initialDelaySeconds: {{ .Values.shelfFront.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.shelfFront.probes.liveness.periodSeconds }}
