apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.shelfAuth.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.shelfAuth.name }}
    app.kubernetes.io/component: backend

spec:
  replicas: {{ .Values.shelfAuth.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.shelfAuth.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.shelfAuth.name }}
        app.kubernetes.io/component: backend

    spec:
      containers:
        - name: {{ .Values.shelfAuth.name }}

          image: "{{ .Values.shelfAuth.image.repository }}:{{ .Values.shelfAuth.image.tag }}"
          imagePullPolicy: {{ .Values.shelfAuth.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.shelfAuth.service.port }}

          resources:
            {{- toYaml .Values.shelfAuth.resources | nindent 12 }}

          env:
            {{- range $key, $value := .Values.shelfAuth.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

            {{- range $key, $value := .Values.shelfAuth.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secretName }}
                  key: {{ $value.key }}
            {{- end }}

          volumeMounts:
            - name: signing-keys
              mountPath: /run/secrets/keys
              readOnly: true

          readinessProbe:
            httpGet:
              path: {{ .Values.shelfAuth.probes.readiness.path }}
              port: {{ .Values.shelfAuth.service.port }}
            initialDelaySeconds: {{ .Values.shelfAuth.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.shelfAuth.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.shelfAuth.probes.liveness.path }}
              port: {{ .Values.shelfAuth.service.port }}
            initialDelaySeconds: {{ .Values.shelfAuth.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.shelfAuth.probes.liveness.periodSeconds }}

      volumes:
        - name: signing-keys
          secret:
            secretName: shelf-auth-keys
