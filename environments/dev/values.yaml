# environments/dev/values.yaml

global:
  namespace: shelf-dev

shelfAuth:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/slavasuhoveev/shelf-auth
    tag: 151bf3593759a47166ce0071a828eb7a05fba25d
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    ENV: dev
    CORS_ORIGINS: https://dev.shelful.club
    COOKIE_SECURE: "true"
    COOKIE_SAMESITE: Lax
    COOKIE_DOMAIN: ""
  secretEnv:
    DATABASE_URL:
      secretName: shelf-auth-secrets
      key: database-url
  migration:
    enabled: true

shelfAuthDb:
  enabled: false

shelfApi:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/slavasuhoveev/shelf-api
    tag: c39b004dbd15f6ef0838c8cd2d51fccc20dc5ddb
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    POSTGRES_USER: shelf_api_user
    POSTGRES_DB: shelf_api
    POSTGRES_PORT: "5432"
    POSTGRES_HOST: shelful-dev-postgres.c38s482o2bb7.eu-central-1.rds.amazonaws.com
    CORS_ORIGINS: https://dev.shelful.club
  secretEnv:
    POSTGRES_PASSWORD:
      secretName: shelf-api-secrets
      key: postgres-password
  migration:
    enabled: true

shelfApiDb:
  enabled: false

shelfFront:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/slavasuhoveev/shelf-front
    tag: b5a0049c7e202140a935a1b16ef6dfcd3530bd91
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: alb
  frontHost: dev.shelful.club
  authHost: auth.dev.shelful.club
  apiHost: api.dev.shelful.club

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:109537136497:certificate/cf450415-cc64-4f88-be9c-60f28ffc1670
